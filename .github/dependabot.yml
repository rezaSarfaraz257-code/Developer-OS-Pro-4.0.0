version: 2
updates:
  - package-ecosystem: pip
    directory: "/Backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      python-production:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/Frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend-production:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/Backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/Runner"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
