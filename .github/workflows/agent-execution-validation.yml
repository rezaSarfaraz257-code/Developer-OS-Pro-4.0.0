name: Agent Execution Loop Validation

on:
  pull_request:
    paths:
      - "Backend/api/agent_execution.py"
      - "Backend/api/management/commands/worker.py"
      - "Backend/api/migrations/0037_agent_task_execution_evidence.py"
      - "Backend/api/models.py"
      - "Backend/api/test_agent_execution.py"
      - "Backend/api/urls.py"
      - "Frontend/src/Project/AIAssistant/**"
      - ".github/workflows/agent-execution-validation.yml"
  push:
    branches: [master]
    paths:
      - "Backend/api/agent_execution.py"
      - "Backend/api/management/commands/worker.py"
      - "Backend/api/migrations/0037_agent_task_execution_evidence.py"
      - "Backend/api/models.py"
      - "Backend/api/test_agent_execution.py"
      - "Backend/api/urls.py"
      - "Frontend/src/Project/AIAssistant/**"
      - ".github/workflows/agent-execution-validation.yml"

permissions:
  contents: read

jobs:
  backend-agent-execution:
    name: Agent execution API, worker and migration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developeros_test
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developeros -d developeros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: Backend
    env:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-entropy-123456789-abcdef
      ENVIRONMENT: development
      ALLOWED_HOSTS: backend,localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost
      CSRF_TRUSTED_ORIGINS: http://localhost
      DATABASE_URL: postgresql://developeros:test-password@127.0.0.1:5432/developeros_test
      IDE_RUNNER_TOKEN: ci-runner-token
      EMAIL_VERIFICATION_REQUIRED: "false"
      SECURE_SSL_REDIRECT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration and migration consistency
        run: |
          export GITHUB_TOKEN_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Agent execution loop regression tests
        run: python manage.py test api.test_agent_execution --verbosity 2

  frontend-agent-execution:
    name: AI Assistant lint, build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Run frontend unit tests
        run: npm test
