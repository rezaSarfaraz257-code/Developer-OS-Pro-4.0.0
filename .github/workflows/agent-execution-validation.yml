name: Agent Execution Loop Validation

on:
  pull_request:
    paths:
      - "Backend/api/agent_execution.py"
      - "Backend/api/management/commands/worker.py"
      - "Backend/api/migrations/0037_agent_task_execution_evidence.py"
      - "Backend/api/models.py"
      - "Backend/api/test_agent_execution.py"
      - "Backend/api/test_agent_runner_integration.py"
      - "Backend/api/urls.py"
      - "Runner/**"
      - "Frontend/src/Project/AIAssistant/**"
      - ".github/workflows/agent-execution-validation.yml"
  push:
    branches: [master]
    paths:
      - "Backend/api/agent_execution.py"
      - "Backend/api/management/commands/worker.py"
      - "Backend/api/migrations/0037_agent_task_execution_evidence.py"
      - "Backend/api/models.py"
      - "Backend/api/test_agent_execution.py"
      - "Backend/api/test_agent_runner_integration.py"
      - "Backend/api/urls.py"
      - "Runner/**"
      - "Frontend/src/Project/AIAssistant/**"
      - ".github/workflows/agent-execution-validation.yml"

permissions:
  contents: read

jobs:
  backend-agent-execution:
    name: Agent execution API, worker and migration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developeros_test
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developeros -d developeros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: Backend
    env:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-entropy-123456789-abcdef
      ENVIRONMENT: development
      ALLOWED_HOSTS: backend,localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost
      CSRF_TRUSTED_ORIGINS: http://localhost
      DATABASE_URL: postgresql://developeros:test-password@127.0.0.1:5432/developeros_test
      IDE_RUNNER_TOKEN: ci-runner-token
      GITHUB_TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      EMAIL_VERIFICATION_REQUIRED: "false"
      SECURE_SSL_REDIRECT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration and migration consistency
        run: |
          export GITHUB_TOKEN_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Agent execution loop regression tests
        run: python manage.py test api.test_agent_execution --verbosity 2

  frontend-agent-execution:
    name: AI Assistant lint, build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Run frontend unit tests
        run: npm test


  backend-runner-integration:
    name: Backend to strict isolated Runner integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developeros_integration
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developeros -d developeros_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: Backend
    env:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-entropy-123456789-abcdef
      ENVIRONMENT: development
      ALLOWED_HOSTS: backend,localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost
      CSRF_TRUSTED_ORIGINS: http://localhost
      DATABASE_URL: postgresql://developeros:integration-password@127.0.0.1:5432/developeros_integration
      IDE_RUNNER_URL: http://127.0.0.1:8080
      IDE_RUNNER_TOKEN: ci-runner-integration-token
      GITHUB_TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      EMAIL_VERIFICATION_REQUIRED: "false"
      SECURE_SSL_REDIRECT: "false"
      AGENT_RUNNER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Build strict Runner image
        run: docker build --pull -t developer-os-runner-ci:agent-loop ../Runner
      - name: Start strict isolated Runner
        env:
          RUNNER_WORKSPACE_VOLUME: ${{ runner.temp }}/agent-runner-workspaces
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils jq curl
          sudo bash ../Runner/prepare-host.sh
          mkdir -p "$RUNNER_WORKSPACE_VOLUME"
          sudo chown 10001:10001 "$RUNNER_WORKSPACE_VOLUME"
          docker run -d --name developer-os-runner-ci \
            --publish 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:size=256m,noexec,nosuid,nodev \
            --tmpfs /run:size=16m,noexec,nosuid,nodev \
            --mount "type=bind,src=$RUNNER_WORKSPACE_VOLUME,dst=/workspaces" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt apparmor=developer-os-runner \
            --security-opt seccomp=../Runner/seccomp-bwrap.json \
            --pids-limit 128 --memory 1g --cpus 2 \
            --env IDE_RUNNER_TOKEN="$IDE_RUNNER_TOKEN" \
            --env RUNNER_SECURITY_LEVEL=strict \
            --env RUNNER_SANDBOX_MODE=bwrap \
            --env RUNNER_ALLOW_NETWORK=false \
            --env RUNNER_MEMORY_MB=768 \
            developer-os-runner-ci:agent-loop
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/health >/dev/null
          docker exec developer-os-runner-ci sh -c 'cat /proc/self/attr/current; grep -E "^(NoNewPrivs|Seccomp|CapEff):" /proc/self/status; cat /proc/sys/user/max_user_namespaces'
          echo "Host namespace and AppArmor policy:"
          for setting in /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
            if [ -r "$setting" ]; then printf '%s=' "$setting"; cat "$setting"; else printf '%s=unavailable\n' "$setting"; fi
          done
          sudo aa-status | grep -E 'developer-os-runner|docker-default' || true
          docker inspect --format 'Runner security options: {{json .HostConfig.SecurityOpt}}' developer-os-runner-ci
          # Read-only runtime inspection: identify masked procfs paths without changing container security.
          docker inspect --format 'Runner masked paths: {{json .HostConfig.MaskedPaths}}' developer-os-runner-ci
          docker inspect --format 'Runner readonly paths: {{json .HostConfig.ReadonlyPaths}}' developer-os-runner-ci
          docker exec developer-os-runner-ci sh -c 'grep -E " /proc([ /]|$)" /proc/self/mountinfo || true; for path in /proc/kcore /proc/keys /proc/timer_list /proc/sysrq-trigger /proc/sys; do if [ -e "$path" ]; then stat -c "%n %F %a" "$path" 2>/dev/null || true; else printf "%s=absent\\n" "$path"; fi; done'
          # Run the exact production capability probe, then split namespace setup from procfs mount.
          docker exec developer-os-runner-ci /usr/bin/bwrap --version
          # Keep the integration job failing unless the complete strict probe passes.
          if docker exec developer-os-runner-ci /usr/bin/bwrap --verbose --die-with-parent --new-session --unshare-user --unshare-pid --unshare-uts --unshare-ipc --unshare-net --ro-bind /usr /usr --ro-bind /usr/local /usr/local --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --ro-bind /etc /etc --proc /proc --dev /dev -- /bin/true; then
            strict_probe_status=0
          else
            strict_probe_status=$?
            echo "Strict Bubblewrap probe failed with exit code ${strict_probe_status}; running non-relaxing stage diagnostics."
          fi
          # Stage A: prove user namespace creation and bind mounts independently.
          docker exec developer-os-runner-ci /usr/bin/bwrap --verbose --die-with-parent --new-session --unshare-user --ro-bind /usr /usr --ro-bind /bin /bin -- /bin/true || true
          # Stage B: add PID namespace creation without mounting procfs.
          docker exec developer-os-runner-ci /usr/bin/bwrap --verbose --die-with-parent --new-session --unshare-user --unshare-pid --ro-bind /usr /usr --ro-bind /bin /bin -- /bin/true || true
          # Stage C: add only the procfs mount to the successful namespace setup.
          docker exec developer-os-runner-ci /usr/bin/bwrap --verbose --die-with-parent --new-session --unshare-user --unshare-pid --ro-bind /usr /usr --ro-bind /bin /bin --proc /proc -- /bin/true || true
          echo "AppArmor audit records after staged probes:"
          sudo journalctl -k --since '-3 minutes' --no-pager 2>/dev/null | grep -E 'apparmor="(DENIED|ALLOWED)".*(developer-os-runner|bwrap)|profile="developer-os-runner"' | tail -80 || true
          if [ "${strict_probe_status}" -ne 0 ]; then
            exit "${strict_probe_status}"
          fi
          docker exec -w /app developer-os-runner-ci /opt/venv/bin/python -c "import main; assert main._bwrap_runtime_available(), 'strict Bubblewrap isolation is unavailable'"
      - name: Check Django configuration and migrate integration database
        run: |
          python manage.py check
          python manage.py migrate --noinput
      - name: Execute real Backend to Runner verification and human acceptance
        run: python manage.py test api.test_agent_runner_integration --verbosity 2
      - name: Collect Runner diagnostics on failure
        if: failure()
        run: |
          docker logs developer-os-runner-ci || true
          sudo aa-status | grep -E 'developer-os-runner|docker-default' || true
          # Capture the host kernel's exact AppArmor denial; do not weaken policy
          # based only on Bubblewrap's generic errno.
          sudo journalctl -k --since '-10 minutes' --no-pager 2>/dev/null | grep -E 'apparmor="DENIED"|audit.*DENIED' | tail -80 || true
          # Diagnostic only: distinguish the custom seccomp allowlist from
          # AppArmor/userns denial using /bin/true (never workspace code).
          docker run --rm --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt apparmor=developer-os-runner \
            --security-opt seccomp=unconfined \
            developer-os-runner-ci:agent-loop \
            /usr/bin/bwrap --die-with-parent --new-session \
              --unshare-user --unshare-pid --unshare-uts --unshare-ipc --unshare-net \
              --ro-bind /usr /usr --ro-bind /usr/local /usr/local \
              --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
              --ro-bind /etc /etc --proc /proc --dev /dev -- /bin/true || true
      - name: Stop strict Runner
        if: always()
        run: docker rm -f developer-os-runner-ci || true
