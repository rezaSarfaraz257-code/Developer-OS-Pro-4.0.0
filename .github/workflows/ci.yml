name: Production Validation

on:
  push:
    branches: [main, master, production-complete-2026-10-06]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developeros_test
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developeros -d developeros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        working-directory: Backend
        run: python3 -m pip install -r requirements.txt
      - name: Django checks and tests
        working-directory: Backend
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-entropy-123456789-abcdef
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          DATABASE_URL: postgresql://developeros:test-password@127.0.0.1:5432/developeros_test
          IDE_RUNNER_TOKEN: ci-runner-token
          EMAIL_VERIFICATION_REQUIRED: "false"
          SECURE_SSL_REDIRECT: "false"
        run: |
          export GITHUB_TOKEN_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python3 manage.py check --deploy
          python3 manage.py makemigrations --check --dry-run
          python3 manage.py migrate --noinput
          python3 manage.py test --verbosity 1

  frontend:
    name: Frontend lint build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Lint
        working-directory: Frontend
        run: npm run lint
      - name: Build
        working-directory: Frontend
        run: npm run build
      - name: Unit tests
        working-directory: Frontend
        run: npm test

  runner:
    name: Secure runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runner/requirements.txt
      - name: Install runner dependencies
        working-directory: Runner
        run: python3 -m pip install -r requirements.txt
      - name: Runner unit tests
        working-directory: Runner
        env:
          RUNNER_ROOT: /tmp/developer-os-runner-workspaces
          RUNNER_SECURITY_LEVEL: compat
        run: python3 -m unittest discover -s . -p 'test_*.py'
      - name: Build runner image
        run: docker build -t developer-os-runner:ci ./Runner
      - name: Runner container smoke
        run: |
          docker run -d --name developer-os-runner-ci -e IDE_RUNNER_TOKEN=ci-runner-token -e RUNNER_SECURITY_LEVEL=compat -e RUNNER_SANDBOX_MODE=container -p 18080:8080 developer-os-runner:ci
          trap 'docker rm -f developer-os-runner-ci || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/ready -H 'Authorization: Bearer ci-runner-token'
          curl -fsS -X POST http://127.0.0.1:18080/exec             -H 'Authorization: Bearer ci-runner-token'             -H 'Content-Type: application/json'             --data '{"workspace_id":"999","files":{"main.py":"print(42)"},"active_file":"main.py","command":"python3 main.py"}'             | tee runner-result.json
          grep -q '"exit_code":0' runner-result.json
          grep -q '42' runner-result.json
          curl -fsS -X POST http://127.0.0.1:18080/process/start             -H 'Authorization: Bearer ci-runner-token'             -H 'Content-Type: application/json'             --data '{"workspace_id":"999","files":{},"command":"python -c \"print(42)\""}'             | tee process-result.json
          grep -q '"id"' process-result.json

  release-gate:
    name: Static release gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, runner]
    steps:
      - uses: actions/checkout@v4
      - name: Release gate
        run: python scripts/release_gate.py
