name: Production Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Django checks + PostgreSQL migrations + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developeros_test
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U developeros -d developeros_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        working-directory: Backend
        run: python -m pip install -r requirements.txt
      - name: Django production checks
        working-directory: Backend
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-entropy-123456789-abcdef
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          DATABASE_URL: postgresql://developeros:test-password@127.0.0.1:5432/developeros_test
          IDE_RUNNER_TOKEN: ci-runner-token
          EMAIL_VERIFICATION_REQUIRED: "false"
          SECURE_SSL_REDIRECT: "false"
        run: |
          export GITHUB_TOKEN_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test --verbosity 2

  frontend:
    name: Frontend lint + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Lint
        working-directory: Frontend
        run: npm run lint
      - name: Build
        working-directory: Frontend
        run: npm run build
      - name: Unit tests
        working-directory: Frontend
        run: npm test

  runner:
    name: Runner unit + container integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runner/requirements.txt
      - name: Runner unit tests
        working-directory: Runner
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s . -p 'test_*.py'
      - name: Build runner image
        run: docker build -t developer-os-runner:ci ./Runner
      - name: Start runner
        run: |
          docker run -d --name developer-os-runner-ci \
            -e IDE_RUNNER_TOKEN=ci-runner-token \
            -p 18080:8080 developer-os-runner:ci
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 2
          done
      - name: Runner integration
        run: |
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS -X POST http://127.0.0.1:18080/exec \
            -H 'Authorization: Bearer ci-runner-token' \
            -H 'Content-Type: application/json' \
            --data '{"workspace_id":"999","files":{"main.py":"print(42)"},"active_file":"main.py","command":"python main.py"}' \
            | tee runner-result.json
          grep -q '"exit_code":0' runner-result.json
          grep -q '42' runner-result.json
      - name: Runner cleanup
        if: always()
        run: docker rm -f developer-os-runner-ci || true

  docker-stack:
    name: Full Docker/PostgreSQL/Runner/Frontend smoke E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend, runner]
    steps:
      - uses: actions/checkout@v4
      - name: Build complete stack
        run: docker compose build --pull
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ENVIRONMENT: ci
          EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
          DJANGO_SECRET_KEY: ci-secret-key-123456789-abcdef
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          IDE_RUNNER_TOKEN: ci-runner-token
          EMAIL_VERIFICATION_REQUIRED: "false"
      - name: Start complete stack
        run: docker compose up -d
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ENVIRONMENT: ci
          EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
          DJANGO_SECRET_KEY: ci-secret-key-123456789
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          IDE_RUNNER_TOKEN: ci-runner-token
          EMAIL_VERIFICATION_REQUIRED: "false"
      - name: Wait for readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1/api/health/ready/; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=200 backend
          exit 1
      - name: E2E smoke
        run: node e2e/smoke.mjs http://127.0.0.1
      - name: Inspect stack
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=200 backend runner frontend
      - name: Shutdown
        if: always()
        run: docker compose down -v

  release-gate:
    name: Release artifact gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, runner, docker-stack]
    steps:
      - uses: actions/checkout@v4
      - name: Run static release gate
        run: python scripts/release_gate.py
