name: Production Validation

on:
  push:
    branches: [main, master, production-complete-2026-10-06, ops/production-hardening-2026-10-16]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developeros_test
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developeros -d developeros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        working-directory: Backend
        run: python3 -m pip install -r requirements.txt
      - name: Verify dependency consistency
        working-directory: Backend
        run: python3 -m pip check
      - name: Django checks and tests
        working-directory: Backend
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-entropy-123456789-abcdef
          ENVIRONMENT: development
          ALLOWED_HOSTS: backend,localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          DATABASE_URL: postgresql://developeros:test-password@127.0.0.1:5432/developeros_test
          IDE_RUNNER_TOKEN: ci-runner-token
          EMAIL_VERIFICATION_REQUIRED: "false"
          SECURE_SSL_REDIRECT: "false"
        run: |
          export GITHUB_TOKEN_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python3 manage.py check --deploy
          python3 manage.py makemigrations --check --dry-run
          python3 manage.py migrate --noinput
          python3 manage.py test --verbosity 1
      - name: Validate production configuration contract
        working-directory: Backend
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-production-config-secret-key-with-enough-entropy-123456789
          ENVIRONMENT: production
          ALLOWED_HOSTS: api.example.com
          FRONTEND_URL: https://app.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
          CSRF_TRUSTED_ORIGINS: https://app.example.com
          DATABASE_URL: postgresql://developeros:test-password@127.0.0.1:5432/developeros_test
          CACHE_URL: redis://127.0.0.1:6379/0
          EMAIL_HOST: smtp.example.com
          EMAIL_PORT: "587"
          EMAIL_HOST_USER: ci@example.com
          EMAIL_HOST_PASSWORD: ci-password
          EMAIL_USE_TLS: "true"
          GITHUB_TOKEN_ENCRYPTION_KEY: ci-only-encryption-key
          IDE_RUNNER_TOKEN: ci-runner-token
          SECURE_SSL_REDIRECT: "false"
        run: |
          python3 manage.py check --deploy
          python3 manage.py shell -c 'from django.conf import settings; assert settings.IS_PRODUCTION; assert settings.DB_POOL_ENABLED; print("production configuration contract: OK")'

  frontend:
    name: Frontend lint build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Dependency audit
        working-directory: Frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: Frontend
        run: npm run lint
      - name: Build
        working-directory: Frontend
        run: npm run build
      - name: Unit tests
        working-directory: Frontend
        run: npm test

  runner:
    name: Secure runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runner/requirements.txt
      - name: Install runner dependencies
        working-directory: Runner
        run: python3 -m pip install -r requirements.txt
      - name: Runner dependency consistency
        working-directory: Runner
        run: python3 -m pip check
      - name: Runner unit tests
        working-directory: Runner
        env:
          RUNNER_ROOT: /tmp/developer-os-runner-workspaces
          RUNNER_SECURITY_LEVEL: compat
        run: python3 -m unittest discover -s . -p 'test_*.py'
      - name: Build runner image
        run: docker build -t developer-os-runner:ci ./Runner
      - name: Runner container smoke
        run: |
          docker run -d --name developer-os-runner-ci -e IDE_RUNNER_TOKEN=ci-runner-token -e RUNNER_SECURITY_LEVEL=compat -e RUNNER_SANDBOX_MODE=container -p 18080:8080 developer-os-runner:ci
          trap 'docker rm -f developer-os-runner-ci || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/ready -H 'Authorization: Bearer ci-runner-token'
          curl -fsS -X POST http://127.0.0.1:18080/exec \
            -H 'Authorization: Bearer ci-runner-token' \
            -H 'Content-Type: application/json' \
            --data '{"workspace_id":"999","files":{"main.py":"print(42)"},"active_file":"main.py","command":"python3 main.py"}' \
            | tee runner-result.json
          grep -q '"exit_code":0' runner-result.json
          grep -q '42' runner-result.json
          curl -fsS -X POST http://127.0.0.1:18080/process/start \
            -H 'Authorization: Bearer ci-runner-token' \
            -H 'Content-Type: application/json' \
            --data '{"workspace_id":"999","files":{},"command":"python -c \"print(42)\""}' \
            | tee process-result.json
          grep -q '"id"' process-result.json
      - name: Verify strict mode fails closed in the actual runner container
        env:
          RUNNER_SECURITY_LEVEL: strict
          IDE_RUNNER_TOKEN: ci-runner-strict-token
        run: |
          docker run -d --name developer-os-runner-strict-ci -e IDE_RUNNER_TOKEN="$IDE_RUNNER_TOKEN" -e RUNNER_SECURITY_LEVEL=strict -e RUNNER_SANDBOX_MODE=container -p 18081:8080 developer-os-runner:ci
          trap 'docker rm -f developer-os-runner-strict-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/health >/dev/null
          status="$(curl -sS -o strict-result.json -w '%{http_code}' -X POST http://127.0.0.1:18081/exec \
            -H "Authorization: Bearer $IDE_RUNNER_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"workspace_id":"998","files":{"main.py":"print(42)"},"active_file":"main.py","command":"python3 main.py"}')"
          test "$status" = "503"
          grep -q 'per-execution isolation' strict-result.json

  backup-restore:
    name: PostgreSQL backup and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developeros_recovery
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: recovery-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developeros -d developeros_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Backup, destroy, restore and verify
        env:
          POSTGRES_DB: developeros_recovery
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: recovery-password
          BACKUP_DIR: /repo/recovery-backups
        run: |
          docker run --rm --network host -v "$PWD:/repo" -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e BACKUP_DIR postgres:17-alpine sh -ec '
            export PGPASSWORD="$POSTGRES_PASSWORD"
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE recovery_probe(id integer primary key, value text not null); INSERT INTO recovery_probe VALUES (1, chr(98)||chr(97)||chr(99)||chr(107)||chr(117)||chr(112)||chr(45)||chr(114)||chr(101)||chr(115)||chr(116)||chr(111)||chr(114)||chr(101)||chr(45)||chr(111)||chr(107));"
            unset PGPASSWORD
            export PGHOST=127.0.0.1
            sh /repo/scripts/backup_postgres.sh
            BACKUP_FILE="$(find /repo/recovery-backups -name "*.dump" -type f | head -n 1)"
            CHECKSUM_FILE="$BACKUP_FILE.sha256"
            test -n "$BACKUP_FILE"
            test -f "$CHECKSUM_FILE"
            (cd "$(dirname "$BACKUP_FILE")" && sha256sum -c "$(basename "$CHECKSUM_FILE")")
            export PGPASSWORD="$POSTGRES_PASSWORD"
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DROP TABLE recovery_probe;"
            pg_restore --clean --if-exists --no-owner --no-acl -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" "$BACKUP_FILE"
            test "$(psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT value FROM recovery_probe WHERE id=1")" = "backup-restore-ok"
            unset PGPASSWORD
          '

  docker-stack:
    name: Full Docker Compose validation
    runs-on: ubuntu-latest
    needs: [backend, frontend, runner, backup-restore]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-password
          DJANGO_SECRET_KEY: ci-compose-secret-key-with-enough-entropy-123456789
          IDE_RUNNER_TOKEN: ci-compose-runner-token
        run: docker compose config -q
      - name: Build complete Docker stack
        env:
          POSTGRES_PASSWORD: ci-compose-password
          DJANGO_SECRET_KEY: ci-compose-secret-key-with-enough-entropy-123456789
          IDE_RUNNER_TOKEN: ci-compose-runner-token
          RUNNER_SANDBOX_MODE: container
        run: docker compose build --pull
      - name: Start and validate complete stack
        env:
          POSTGRES_PASSWORD: ci-compose-password
          DJANGO_SECRET_KEY: ci-compose-secret-key-with-enough-entropy-123456789
          IDE_RUNNER_TOKEN: ci-compose-runner-token
          RUNNER_SANDBOX_MODE: container
          SECURE_SSL_REDIRECT: "false"
          ENVIRONMENT: development
          ALLOWED_HOSTS: backend,localhost
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          EMAIL_VERIFICATION_REQUIRED: "false"
        run: |
          trap 'status=$?; echo "=== DOCKER COMPOSE PS ==="; docker compose ps -a || true; echo "=== BACKEND LOGS ==="; docker compose logs --no-color --tail=250 backend || true; echo "=== WORKER LOGS ==="; docker compose logs --no-color --tail=120 worker || true; docker compose down -v --remove-orphans; exit $status' EXIT
          docker compose up -d db redis runner backend
          docker compose ps
          for i in $(seq 1 60); do
            if docker compose exec -T backend python -c 'import socket; s=socket.create_connection(("127.0.0.1",8000),2); s.close()' >/dev/null 2>&1; then break; fi
            sleep 5
          done
          docker compose exec -T backend python manage.py check --deploy
          docker compose exec -T backend python manage.py shell -c 'import urllib.request; urllib.request.urlopen("http://backend:8000/api/health/ready/", timeout=5)'
          docker compose up -d --no-deps worker
          docker compose up -d --no-deps frontend
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1/ >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1/ >/dev/null
          docker compose ps

  release-gate:
    name: Static release and operational gates
    runs-on: ubuntu-latest
    needs: [backend, frontend, runner, backup-restore, docker-stack]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release gate
        run: python scripts/release_gate.py
      - name: Operational policy gate
        run: python scripts/operational_policy_gate.py
