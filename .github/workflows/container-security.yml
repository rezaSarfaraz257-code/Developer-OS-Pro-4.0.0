name: Container Security

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, ops/production-hardening-2026-10-16]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  runner-image:
    name: Scan hardened runner image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build runner image
        run: docker build --pull -t developer-os-runner:security ./Runner

      - name: Generate runner image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: developer-os-runner:security
          format: spdx-json
          artifact-name: developer-os-runner-sbom.spdx.json
          output-file: developer-os-runner-sbom.spdx.json

      - name: Scan runner image for OS and language vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: developer-os-runner:security
          format: sarif
          output: trivy-runner.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          scanners: vuln,secret,misconfig
          version: v0.76.0
          exit-code: "1"

      - name: Upload container findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-runner.sarif
