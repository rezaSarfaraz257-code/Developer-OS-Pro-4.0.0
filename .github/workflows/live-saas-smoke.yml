name: Live SaaS Smoke Monitor

on:
  pull_request:
    paths:
      - "scripts/live_saas_contracts.mjs"
      - "scripts/live_saas_contracts.test.mjs"
      - "scripts/live_saas_smoke.mjs"
      - ".github/workflows/live-saas-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: live-saas-smoke-monitor
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only production availability and route checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      # PR runs only execute unit tests and must not wait for production-environment approval.
      # Scheduled/manual live probes still use the protected production environment.
      name: ${{ github.event_name == 'pull_request' && 'ci' || 'production' }}
      deployment: false
    env:
      # Read the same protected production targets used by the black-box acceptance workflow.
      # Public repository variables and documented defaults remain fallback options.
      FRONTEND_URL: ${{ secrets.PRODUCTION_FRONTEND_URL || vars.PRODUCTION_FRONTEND_URL || 'https://developer-os-version-3-0-5.onrender.com' }}
      API_URL: ${{ secrets.PRODUCTION_BASE_URL || vars.PRODUCTION_BASE_URL || 'https://dos-o91y.onrender.com' }}
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test live SaaS contract validators
        run: node --test scripts/live_saas_contracts.test.mjs
      - name: Run read-only live observability checks
        id: smoke
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/live_saas_smoke.mjs
      - name: Publish live health summary
        if: always()
        run: |
          if [ -f live-saas-smoke.json ]; then
            node --input-type=commonjs -e '
              const r=require("./live-saas-smoke.json");
              console.log("# Developer OS — Live SaaS Observability\n");
              console.log("**Result:** "+(r.ok?"PASS":"FAIL")+" · **Timestamp:** "+r.timestamp+" · **Duration:** "+r.durationMs+" ms\n");
              console.log("| Signal | Result |");
              console.log("|---|---:|");
              console.log("| Checks passed | "+r.summary.passed+"/"+r.summary.total+" |");
              console.log("| Failed checks | "+r.summary.failed+" |");
              console.log("| Recovered after retry | "+r.summary.recovered+" |");
              console.log("| Frontend | "+r.frontendBase+" |");
              console.log("| API | "+r.apiBase+" |");
              if (r.diagnostics?.length) {
                console.log("\n## Diagnostics\n");
                for (const d of r.diagnostics) console.log("- **"+d.severity.toUpperCase()+" / "+d.code+":** "+d.message+" Action: "+d.action);
              }
              console.log("\n| Check | HTTP | Attempts | Duration | Status | Details |");
              console.log("|---|---:|---:|---:|---|---|");
              for(const c of r.checks) {
                const status=c.ok?(c.recovered?"RECOVERED":"PASS"):"FAIL";
                const detail=c.ok?"—":String(c.error||"failed").replace(/[|\n\r]/g," ");
                console.log("| "+c.name+" | "+(c.status??"—")+" | "+c.attempts+" | "+c.durationMs+" ms | "+status+" | "+detail+" |");
              }
              console.log("\n> Read-only external smoke monitoring only. This does not authenticate, mutate production data, execute user code, or replace full release acceptance.");
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Developer OS — Live SaaS Observability" >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "**Production probe status: NOT RUN.** Pull-request runs validate the monitor's unit tests only; a green job here is not evidence that production is healthy." >> "$GITHUB_STEP_SUMMARY"
              echo "Run the scheduled/manual monitor on the default branch to generate live JSON evidence." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**Production probe status: NO REPORT.** Smoke script did not produce a report. Check origin configuration and runner logs." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Upload machine-readable evidence
        if: always() && hashFiles('live-saas-smoke.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: live-saas-observability-${{ github.run_id }}
          path: live-saas-smoke.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail if any live check failed
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "::error::One or more live SaaS checks failed. Inspect the summary and JSON artifact."
            exit 1
          fi
