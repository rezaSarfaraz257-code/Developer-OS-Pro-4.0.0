name: Operational Policy Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operational-policy:
    name: Production operational contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production contract
        run: python scripts/operational_policy_gate.py
