name: Production Black-Box Validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Production target label"
        required: false
        default: "render-production"
        type: string

permissions:
  contents: read

concurrency:
  group: production-black-box-validation
  cancel-in-progress: false

jobs:
  production-e2e:
    name: Deployed SaaS + IDE + Runner + Billing E2E
    if: ${{ secrets.PRODUCTION_BASE_URL != '' && secrets.PRODUCTION_BILLING_WEBHOOK_SECRET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployed production
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          PRODUCTION_BILLING_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_BILLING_WEBHOOK_SECRET }}
          PRODUCTION_TARGET: ${{ inputs.target }}
        run: node scripts/production_validate.mjs

  configuration-warning:
    name: Production validation configuration
    if: ${{ secrets.PRODUCTION_BASE_URL == '' || secrets.PRODUCTION_BILLING_WEBHOOK_SECRET == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when production secrets are missing
        run: |
          echo "::error::Production validation is blocked because PRODUCTION_BASE_URL and PRODUCTION_BILLING_WEBHOOK_SECRET must both be configured."
          echo "Configure the real deployment secrets and run this workflow again."
          exit 1
