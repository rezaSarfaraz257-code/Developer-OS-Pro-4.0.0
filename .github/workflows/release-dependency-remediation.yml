name: Release dependency remediation

on:
  push:
    branches: [release/production-100-gate]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Regenerate lockfile and apply non-breaking audit fixes
        working-directory: Frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- Frontend/package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/package-lock.json
          git commit -m "security: refresh frontend lockfile after audit remediation"
          git push
