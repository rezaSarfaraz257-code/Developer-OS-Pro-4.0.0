name: Resilience Gate

on:
  pull_request:
    paths:
      - "Runner/**"
      - ".github/workflows/resilience-gate.yml"
  push:
    branches:
      - "p4/**"
    paths:
      - "Runner/**"
      - ".github/workflows/resilience-gate.yml"

permissions:
  contents: read

concurrency:
  group: resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience:
    name: Runner resilience tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Runner/requirements.txt

      - name: Install runner dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Compile runner
        run: python -m compileall -q .

      - name: Resilience tests
        run: python -m pytest -q test_resilience.py

      - name: Supply-chain policy gate
        working-directory: .
        run: python scripts/supply_chain_gate.py

      - name: Generate SBOM
        working-directory: .
        run: python scripts/generate_sbom.py

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: developer-os-sbom
          path: artifacts/sbom.json
          if-no-files-found: error
          retention-days: 14

      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build provenance manifest
        working-directory: .
        run: |
          mkdir -p artifacts
          printf "%s\n" "repository=${{ github.repository }}" "commit=${{ github.sha }}" "ref=${{ github.ref }}" "workflow=${{ github.workflow }}" "run_id=${{ github.run_id }}" "runner_os=${{ runner.os }}" > artifacts/provenance.txt

      - name: Generate source integrity manifest
        working-directory: .
        run: |
          python -c 'import hashlib; from pathlib import Path; r=Path("."); fs=[p for p in r.rglob("*") if p.is_file() and ".git" not in p.parts and "artifacts" not in p.parts and p.stat().st_size <= 20000000]; Path("artifacts/source-sha256.txt").write_text("\n".join(sorted(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.as_posix() for p in fs))+"\n")'

      - name: Verify provenance fields
        working-directory: .
        run: |
          test -s artifacts/provenance.txt
          grep -q "^commit=${{ github.sha }}$" artifacts/provenance.txt
          test -s artifacts/source-sha256.txt

      - name: Upload integrity artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developer-os-build-integrity
          path: |
            artifacts/provenance.txt
            artifacts/source-sha256.txt
          if-no-files-found: error
          retention-days: 14


      - name: Runner security policy tests
        run: python -m pytest -q test_security_policy.py

      - name: Fail on unexpected test warnings
        run: python -m pytest -q test_resilience.py test_security_policy.py -W error
