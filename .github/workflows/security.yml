name: Security

on:
  push:
    branches: [ main, master, production-complete-2026-10-06, ops/production-hardening-2026-10-16 ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Audit frontend dependencies
        working-directory: Frontend
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Audit backend dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r Backend/requirements.txt

  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developeros_test
          POSTGRES_USER: developeros
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developeros -d developeros_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        working-directory: Backend
        run: python -m pip install -r requirements.txt pytest
      - name: Django checks and tests
        working-directory: Backend
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-entropy-123456789-abcdef
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          DATABASE_URL: postgresql://developeros:test-password@127.0.0.1:5432/developeros_test
          IDE_RUNNER_TOKEN: ci-runner-token
          EMAIL_VERIFICATION_REQUIRED: "false"
          SECURE_SSL_REDIRECT: "false"
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test -v 1

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
          package-manager-cache: false
      - name: Lint
        working-directory: Frontend
        run: npm ci --ignore-scripts && npm run lint
      - name: Build
        working-directory: Frontend
        run: npm run build
      - name: Tests
        working-directory: Frontend
        run: npm test

  runner-validation:
    name: Runner validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Runner/requirements.txt
      - name: Install runner test dependencies
        working-directory: Runner
        run: python -m pip install -r requirements.txt pytest
      - name: Runner tests
        working-directory: Runner
        env:
          IDE_RUNNER_TOKEN: ci-runner-token
          RUNNER_ROOT: /tmp/developer-os-runner-workspaces
          RUNNER_SECURITY_LEVEL: compat
        run: python -m pytest -q

      - name: Build runner image for strict-mode validation
        run: docker build -t developer-os-runner:security-ci ./Runner

      - name: Verify strict mode fails closed in the runner container
        env:
          IDE_RUNNER_TOKEN: ci-runner-strict-token
        run: |
          docker run -d --name developer-os-runner-strict-security-ci -e IDE_RUNNER_TOKEN="$IDE_RUNNER_TOKEN" -e RUNNER_SECURITY_LEVEL=strict -e RUNNER_SANDBOX_MODE=container -p 18082:8080 developer-os-runner:security-ci
          trap 'docker rm -f developer-os-runner-strict-security-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18082/health >/dev/null
          status="$(curl -sS -o strict-result.json -w "%{http_code}" -X POST http://127.0.0.1:18082/exec \
            -H "Authorization: Bearer $IDE_RUNNER_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"workspace_id":"998","files":{"main.py":"print(42)"},"active_file":"main.py","command":"python3 main.py"}')"
          test "$status" = "503"
          grep -q 'per-execution isolation' strict-result.json

  release-gate:
    name: Release gate
    needs: [codeql, dependency-audit, backend-validation, frontend-validation, runner-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release contract
        run: python scripts/release_gate.py
