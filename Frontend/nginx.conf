map $http_x_forwarded_proto $upstream_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:;" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript application/wasm text/css text/plain text/xml image/svg+xml;

  location /api/ {
    # A location-level add_header disables inheritance of the server-level
    # frontend CSP/X-Frame-Options. Preserve the backend's endpoint-specific
    # policies so sandboxed IDE previews can be framed by the same-origin IDE.
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass ${BACKEND_URL}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  # Channels/ASGI WebSockets power live IDE terminal and collaboration sessions.
  # Keep the connection upgrade explicit and do not buffer the long-lived stream.
  location /ws/ {
    proxy_pass ${BACKEND_URL}/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /media/ {
    proxy_pass ${BACKEND_URL}/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_proto;
  }

  location = /ai { try_files /index.html =404; }
  location = /ai/ { try_files /index.html =404; }
  location = /explore { try_files /index.html =404; }
  location = /projects { try_files /index.html =404; }
  location = /ide { try_files /index.html =404; }
  location = /ide/ { try_files /index.html =404; }
  location = /search { try_files /index.html =404; }
  location = /team { try_files /index.html =404; }
  location = /billing { try_files /index.html =404; }
  location = /referrals { try_files /index.html =404; }
  location = /settings { try_files /index.html =404; }
  location = /audit { try_files /index.html =404; }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
