map $http_x_forwarded_proto $upstream_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass ${BACKEND_ORIGIN}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /media/ {
    proxy_pass ${BACKEND_ORIGIN}/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ai { try_files /index.html =404; }
  location = /ai/ { try_files /index.html =404; }
  location = /explore { try_files /index.html =404; }
  location = /projects { try_files /index.html =404; }
  location = /ide { try_files /index.html =404; }
  location = /search { try_files /index.html =404; }
  location = /team { try_files /index.html =404; }
  location = /billing { try_files /index.html =404; }
  location = /settings { try_files /index.html =404; }
  location = /audit { try_files /index.html =404; }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
