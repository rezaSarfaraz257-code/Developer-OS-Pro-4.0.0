    <linearGradient id="cyan" x1="280" y1="250" x2="760" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6BFFFF"/>
      <stop offset=".5" stop-color="#19C8FF"/>
      <stop offset="1" stop-color="#716BFF"/>
    </linearGradient>
    <linearGradient id="core" x1="350" y1="300" x2="680" y2="710" gradientUnits="userSpaceOnUse">
