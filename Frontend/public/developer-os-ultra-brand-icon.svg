    <path d="M512 246L718 365V603L512 722L306 603V365L512 246Z" fill="url(#core)" stroke="url(#metal)" stroke-width="8"/>
    <path d="M512 277L690 380V588L512 691L334 588V380L512 277Z" stroke="#4AEAFF" stroke-opacity=".35" stroke-width="2"/>
