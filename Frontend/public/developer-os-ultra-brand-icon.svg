    <path d="M639 466L682 511L639 556" stroke="#A78BFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M548 451L493 571" stroke="#45DFFF" stroke-width="15" stroke-linecap="round"/>
