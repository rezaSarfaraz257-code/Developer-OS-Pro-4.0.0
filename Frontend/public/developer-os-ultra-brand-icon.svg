    <path d="M120 512H904M512 120V904" stroke="#7CEEFF" stroke-opacity=".07" stroke-width="2" stroke-dasharray="8 18"/>
    <!-- luminous outer hexagonal chassis -->
    <path d="M512 132L824 312V672L512 852L200 672V312L512 132Z" stroke="#1CCBFF" stroke-width="30" opacity=".22" filter="url(#soft)"/>
    <path d="M512 132L824 312V672L512 852L200 672V312L512 132Z" stroke="url(#metal)" stroke-width="13" stroke-linejoin="round"/>
    <path d="M512 166L794 329V655L512 818L230 655V329L512 166Z" stroke="#9CEFFF" stroke-opacity=".25" stroke-width="2"/>
