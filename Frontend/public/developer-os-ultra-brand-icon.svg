    <path d="M405 378H520C619 378 682 438 682 511C682 584 619 644 520 644H405V378Z" stroke="url(#metal)" stroke-width="38" stroke-linejoin="round"/>
    <path d="M453 426H518C588 426 632 460 632 511C632 562 588 596 518 596H453V426Z" fill="#0A1731"/>
