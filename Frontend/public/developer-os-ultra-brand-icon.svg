<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="118" y1="90" x2="914" y2="936" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101D3B"/>
      <stop offset=".52" stop-color="#080F22"/>
      <stop offset="1" stop-color="#050916"/>
    </linearGradient>
    <linearGradient id="metal" x1="250" y1="180" x2="790" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FFFF"/>
      <stop offset=".22" stop-color="#77F7FF"/>
      <stop offset=".55" stop-color="#28B8FF"/>
      <stop offset=".82" stop-color="#786BFF"/>
      <stop offset="1" stop-color="#C18CFF"/>
