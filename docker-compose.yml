services:
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-developeros}
      POSTGRES_USER: ${POSTGRES_USER:-developeros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-developeros} -d ${POSTGRES_DB:-developeros}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build: ./Backend
    environment:
      DEBUG: "False"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RELEASE_VERSION: "3.0.0-global"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-developeros}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-developeros}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_OAUTH_REDIRECT: ${GITHUB_OAUTH_REDIRECT:-http://localhost/api/github/callback/}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1}
      AI_API_PROTOCOL: ${AI_API_PROTOCOL:-responses}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
      IDE_RUNNER_URL: ${IDE_RUNNER_URL:-http://runner:8080}
      IDE_RUNNER_TOKEN: ${IDE_RUNNER_TOKEN:?Set IDE_RUNNER_TOKEN in .env}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Developer OS <no-reply@localhost>}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      EXPORT_ROOT: /app/media/exports
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python manage.py shell -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health/ready/", timeout=3)' >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_catalog && gunicorn x.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - media_data:/app/media
    networks:
      - default
      - runner_internal


  runner:
    restart: unless-stopped
    build: ./Runner
    environment:
      IDE_RUNNER_TOKEN: ${IDE_RUNNER_TOKEN:?Set IDE_RUNNER_TOKEN in .env}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Developer OS <no-reply@localhost>}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      EXPORT_ROOT: /app/media/exports
    volumes:
      - ide_workspaces:/workspaces
    networks:
      - runner_internal
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
      - /run:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    restart: unless-stopped
    build: ./Backend
    environment:
      DEBUG: "False"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-developeros}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-developeros}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Developer OS <no-reply@localhost>}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      EXPORT_ROOT: /app/media/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py worker --sleep 1"
    volumes:
      - media_data:/app/media

  frontend:
    restart: unless-stopped
    build: ./Frontend
    environment:
      BACKEND_PROXY_URL: http://backend:8000
      BACKEND_PROXY_HOST: localhost
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  runner_internal:
    internal: true

volumes:
  redis_data:
  postgres_data:
  media_data:
  ide_workspaces:
