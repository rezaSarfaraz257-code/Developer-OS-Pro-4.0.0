# Developer OS production Runner for Render.
# Deploy this as a Private Service in the same Render workspace and region as the Django API.
# Then set the backend IDE_RUNNER_URL to the Runner's internal address
# (for example: http://<runner-internal-host>:8080) and use the same IDE_RUNNER_TOKEN.
services:
  - type: pserv
    name: developer-os-runner
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Runner/Dockerfile
    dockerContext: ./Runner
    healthCheckPath: /health
    envVars:
      - key: IDE_RUNNER_TOKEN
        generateValue: true
      - key: RUNNER_TIMEOUT_SECONDS
        value: "120"
      - key: RUNNER_MAX_CONCURRENT
        value: "4"
      - key: RUNNER_ALLOW_NETWORK
        value: "false"
