# Developer OS production Runner for Render.
# Render free uses a public Web Service for the runner. Keep RUNNER_ALLOW_NETWORK=false and require the shared IDE_RUNNER_TOKEN on every runner request.
# For a true private runner, move this service to a Render Private Service or equivalent isolated compute and use its internal address.
services:
  - type: web
    name: developer-os-runner
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Runner/Dockerfile
    dockerContext: ./Runner
    healthCheckPath: /health
    envVars:
      - key: IDE_RUNNER_TOKEN
        generateValue: true
      - key: RUNNER_TIMEOUT_SECONDS
        value: "120"
      - key: RUNNER_MAX_CONCURRENT
        value: "4"
      - key: RUNNER_ALLOW_NETWORK
        value: "false"
